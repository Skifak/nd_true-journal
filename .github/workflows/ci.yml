# CI журнала: проверки на каждый PR и push в ai-dev.
# Сборка Tauri здесь не выполняется — только веб-проверки и защита границ.
name: CI

on:
  pull_request:
  push:
    branches: [ai-dev]

# Минимум прав: только чтение кода, никаких секретов workflow не требует.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверки и границы
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Защита границ — первым шагом: падать нужно быстро и внятно,
      # пока не потрачены минуты на npm ci и проверки.
      - name: Границы проекта (dependencies, CSP)
        run: node scripts/check-boundaries.mjs

      - name: Установка зависимостей
        run: npm ci

      - name: Проверки типов и svelte-check
        run: npm run check

      - name: Сборка
        run: npm run build

      - name: Тесты
        run: npm run test
