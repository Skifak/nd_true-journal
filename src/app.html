<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<!-- CSP: self + blob/data (медиа из IndexedDB) + исходящие запросы AI
		 (OpenAI-compatible API вводится пользователем: https и локальный http).
		 script-src требует 'unsafe-inline': SvelteKit вставляет инлайн-скрипты
		 (данные гидратации), без этого — белый экран. Остальное так же строго.
		 В проде дополнительно действует CSP из tauri.conf.json с nonce. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; worker-src * 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self'; connect-src 'self' ws://localhost:5173 https: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
