<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<!-- CSP: только self + blob/data (медиа из IndexedDB). Никаких внешних источников. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
